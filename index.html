<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaali Tirri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <!-- VIEW 1: Landing Page -->
    <div id="view-landing" class="view-container">
        <h1 class="brand">Kaali Tirri</h1>
        <div class="brand-suit-row">♠ ♥ ♦ ♣</div>
        <div class="landing-card">
            <input type="text" id="playerName" placeholder="Your name">
            <button id="hostBtn" class="btn-success">Create Room</button>
            <div class="divider-row"><hr><span>OR</span><hr></div>
            <input type="text" id="joinId" placeholder="Room ID">
            <button id="joinBtn" class="btn-info">Join Room</button>
        </div>
    </div>

    <!-- VIEW 2: Waiting Room -->
    <div id="view-lobby" class="view-container" style="display: none;">
        <h2>Waiting Room</h2>
        <div id="roomIdDisplay" class="room-id-chip"></div>

        <div id="lobby-players" class="lobby-players"></div>

        <button id="startGameBtn" class="btn-success" style="display: none;">Start Game</button>

        <div class="lobby-utility-row">
            <button id="saveBtn" class="btn-wood">Download Save</button>
            <label for="loadInput" class="btn-wood">Load Save</label>
            <input type="file" id="loadInput" accept=".json" style="display: none;">
        </div>
    </div>

    <!-- VIEW 3: Active Game Board -->
    <div id="view-game" class="view-container" style="display: none;">

        <!-- Top Header Controls -->
        <div id="game-header">
            <div id="phase-display" class="chip">Phase: <span class="phase-label">Lobby</span></div>

            <div id="game-info" class="chip">
                <span id="bid-info"></span><span id="trump-info"></span>
            </div>

            <div id="host-controls-wrapper">
                <button id="hostMenuToggle" aria-label="Host menu">⚙️</button>
                <div id="host-dropdown">
                    <button id="hostReshuffleBtn" class="btn-info">Re-Deal</button>
                    <button id="hostSaveBtn" class="btn-wood">Download Save</button>
                    <label for="hostLoadInput" class="btn-wood">Load Save</label>
                    <input type="file" id="hostLoadInput" accept=".json" style="display: none;">
                    <button id="hostBackToLobbyBtn" class="btn-danger">Return to Lobby</button>
                </div>
            </div>
        </div>

        <!-- Bidding countdown -->
        <div id="timer-bar-wrap">
            <span id="timer-bar-label"></span>
            <div id="timer-bar-track"><div id="timer-bar-fill"></div></div>
            <span id="timer-bar-text">30s</span>
        </div>

        <div id="fold-banner" class="chip" style="display: none; position: absolute; top: 62px; left: 50%; transform: translateX(-50%); z-index: 90;"></div>

        <!-- ACTION OVERLAY -->
        <div id="action-overlay">

            <div id="bidding-panel" class="action-panel">
                <h3>Place Your Bid</h3>
                <p class="hint">Multiples of 5 only, 130&ndash;250 points.</p>
                <input type="number" id="bidAmount" min="130" max="250" step="5">
                <div class="btn-row">
                    <button id="submitBidBtn" class="btn-success">Bid</button>
                    <button id="foldBtn" class="btn-danger">Fold</button>
                </div>
            </div>

            <div id="trump-panel" class="action-panel">
                <h3>Choose Cart &amp; Team</h3>
                <div class="panel-label">Cart (trump suit)</div>
                <select id="trumpSuitSelect">
                    <option value="♠">♠ Spades</option><option value="♥">♥ Hearts</option><option value="♦">♦ Diamonds</option><option value="♣">♣ Clubs</option>
                </select>
                <div class="panel-label">Partner card(s)</div>
                <div id="team-cards-container"></div>
                <button id="setTrumpBtn" class="btn-info">Start Game</button>
            </div>
        </div>

        <div class="table-zone">

            <div id="opponents-area"></div>

            <div id="table-wrapper">
                <div id="center-board"></div>
            </div>

            <div id="my-area"></div>
        </div>

        <!-- Modals -->
        <div id="scorecard-modal" class="modal-card" style="display: none;">
            <h2 id="score-title">Round Over</h2><hr>
            <div class="score-columns">
                <div>
                    <h3 class="team-bidder">🔥 Bidder Team</h3><div id="bidder-stats"></div><br>
                    <strong>Total: <span id="bidder-total"></span></strong><br><small>Target: <span id="bid-target"></span></small>
                </div>
                <div class="col-divider"></div>
                <div>
                    <h3 class="team-defender">🛡️ Defender Team</h3><div id="defender-stats"></div><br>
                    <strong>Total: <span id="defender-total"></span></strong>
                </div>
            </div><hr>
            <button id="modalBackToLobbyBtn" class="btn-danger">Return to Lobby</button>
        </div>

        <div id="won-cards-modal-backdrop" style="display: none;"></div>
        <div id="won-cards-modal" style="display: none;">
            <div class="won-cards-header">
                <h3 id="won-cards-title">Won Cards</h3>
                <button id="closeWonCardsBtn" class="btn-danger">✕ Close</button>
            </div>
            <div id="won-cards-list"></div>
        </div>
    </div>

    <script src="network.js"></script>
    <script src="game.js"></script>
    <script src="ui.js"></script>
</body>
</html>
